[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-digital-twin"
version = "0.1.0"
description = "Educational digital twin of an oil transmission pipeline."
readme = "README.md"
requires-python = ">=3.11"

# Tell setuptools that our importable packages live inside src/.
[tool.setuptools.packages.find]
where = ["src"]

# Tell pytest where the tests live.
[tool.pytest.ini_options]
testpaths = ["tests"]
