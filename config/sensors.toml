# Simulated sensor network.
#
# Accuracy values are ILLUSTRATIVE ASSUMPTIONS, not manufacturer data.
#
# noise_std: random scatter between readings, as a standard deviation.
# bias_std: spread of each sensor's fixed calibration error, as a standard
#     deviation. One bias is drawn per sensor and then stays the same.
# missing_probability: chance that any one sample is not recorded.
#
# noise_std and bias_std use the sensor's unit: barg for pressure, m3/h for
# flow, and degC for temperature.
#
# location_km must be the start or end of the line, or a segment join.

[[sensors]]
sensor_id = "PT-001"
quantity = "pressure"
location = "Inlet, just after PS1"
location_km = 0.0
upstream_of_pump = false
sampling_interval_s = 60.0
noise_std = 0.03
bias_std = 0.04
missing_probability = 0.002

